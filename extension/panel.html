<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distinct</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="phone" class="phone">
    <div id="stage"></div>
    <header class="topbar">
      <button type="button" id="top-left" class="square"></button>
      <span id="nav-title" class="topbar-title"></span>
      <button type="button" id="settings" class="square" data-action="open-settings" aria-label="Settings" title="Settings"></button>
    </header>
    <main id="scroller" class="scroller">
      <p id="notice" class="banner" role="alert" hidden></p>
      <div id="app"></div>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Screens"></nav>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <script type="module" src="panel.js"></script>
</body>
</html>
