<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Lexend";
          src: url("../assets/fonts/lexend.woff2") format("woff2");
          font-weight: 100 900;
        }
        #closing-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Lexend", sans-serif;
          color: #221b3d;
        }
        .c-beat {
          position: absolute;
          inset: 0;
        }
        #c-beat-2 {
          opacity: 0;
        }
        #c-title {
          position: absolute;
          left: 120px;
          top: 90px;
          font-size: 132px;
          line-height: 1.08;
          font-weight: 700;
          letter-spacing: -0.03em;
        }
        #c-chips {
          position: absolute;
          left: 120px;
          top: 290px;
          display: flex;
          flex-direction: column;
          gap: 30px;
        }
        .c-chip {
          display: flex;
          align-items: center;
          gap: 30px;
          width: max-content;
          height: 136px;
          padding: 0 56px 0 26px;
          border-radius: 36px;
          font-size: 50px;
          font-weight: 600;
          letter-spacing: -0.01em;
          box-shadow: 0 22px 46px rgba(60, 40, 140, 0.18);
        }
        .c-chip img {
          width: 96px;
          height: 96px;
          object-fit: contain;
        }
        #c-chip-1 {
          background: #6fe9e4;
        }
        #c-chip-2 {
          margin-left: 64px;
          background: #f79bfb;
        }
        #c-chip-3 {
          margin-left: 128px;
          background: #ffb564;
        }
        #c-line {
          position: absolute;
          left: 120px;
          top: 790px;
          width: 1000px;
          font-size: 42px;
          line-height: 1.3;
          font-weight: 500;
          color: #3a3460;
        }
        #c-card {
          position: absolute;
          right: 90px;
          top: 90px;
          width: 620px;
          height: 900px;
          overflow: hidden;
          border-radius: 64px;
          background: #7c5dcd;
          box-shadow: 0 30px 80px rgba(60, 40, 140, 0.3);
        }
        #c-mascot {
          position: absolute;
          left: -30px;
          bottom: -80px;
          width: 680px;
          height: 880px;
          object-fit: contain;
        }

        #c-end {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        #c-logo {
          width: 300px;
          height: 300px;
          object-fit: contain;
        }
        #c-name {
          margin-top: 18px;
          font-size: 132px;
          line-height: 1.05;
          font-weight: 700;
          letter-spacing: -0.03em;
        }
        #c-tag {
          margin-top: 14px;
          font-size: 56px;
          font-weight: 500;
          color: #3a3460;
        }
        #c-facts {
          margin-top: 42px;
          padding: 16px 40px;
          border-radius: 24px;
          background: #221b3d;
          color: #fbfbfb;
          font-size: 36px;
          font-weight: 500;
        }
        #c-note {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 32px;
          text-align: center;
          color: #3a3460;
          font-size: 22px;
        }
      </style>

      <div id="closing-root" data-composition-id="closing" data-width="1920" data-height="1080">
        <div id="c-beat-1" class="c-beat">
          <h1 id="c-title">Built for</h1>
          <div id="c-chips">
            <div id="c-chip-1" class="c-chip"><img src="../assets/3d/tile-chart.webp" alt="" />In-house marketers</div>
            <div id="c-chip-2" class="c-chip"><img src="../assets/3d/tile-doc.webp" alt="" />Freelancers with several stores</div>
            <div id="c-chip-3" class="c-chip"><img src="../assets/3d/tile-chat.webp" alt="" />Small store owners</div>
          </div>
          <p id="c-line">Anyone who has to know the market without living in browser tabs.</p>
          <div id="c-card"><img id="c-mascot" src="../assets/3d/mascot.webp" alt="" /></div>
        </div>

        <div id="c-beat-2" class="c-beat">
          <div id="c-end" class="c-beat">
            <img id="c-logo" src="../assets/3d/logo.webp" alt="Distinct logo" />
            <p id="c-name">Distinct</p>
            <p id="c-tag">Know your market. Stand out.</p>
            <p id="c-facts">Under a minute. A few cents.</p>
          </div>
          <p id="c-note">Independent demo. Not affiliated with the sites shown.</p>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#c-title", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.06);
          tl.fromTo("#c-card", { x: 160, opacity: 0, rotation: 3 }, { x: 0, opacity: 1, rotation: 0, duration: 0.7, ease: "power3.out" }, 0.14);
          tl.fromTo("#c-mascot", { y: 90 }, { y: 0, duration: 0.8, ease: "back.out(1.3)" }, 0.3);
          [1.0, 1.7, 2.4].forEach((at, index) => {
            tl.fromTo(
              `#c-chip-${index + 1}`,
              { x: -70, opacity: 0, scale: 0.9 },
              { x: 0, opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" },
              at,
            );
          });
          tl.fromTo("#c-line", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 3.3);
          tl.to("#c-beat-1", { opacity: 0, duration: 0.2, ease: "power2.in" }, 5.8);

          tl.set("#c-beat-2", { opacity: 1 }, 6);
          tl.fromTo("#c-logo", { scale: 0.62, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.62, ease: "back.out(1.5)" }, 6.1);
          tl.fromTo("#c-name", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 6.42);
          tl.fromTo("#c-tag", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 6.72);
          tl.fromTo("#c-facts", { y: 22, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 7.2);
          tl.fromTo("#c-note", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 7.5);

          window.__timelines["closing"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
